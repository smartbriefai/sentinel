<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel AI | Medical Concierge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <div class="container">
        <header class="glass-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M12 8v4"></path>
                    <path d="M12 16h.01"></path>
                </svg>
                <span>Sentinel <strong>AI</strong></span>
            </div>
            <div class="status-indicator">
                <span class="dot pulse"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <main class="chat-container glass-panel">
            <div id="chat-history" class="chat-history">
                <div class="message ai-message">
                    <div class="avatar">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>
                    <div class="message-content">
                        Hello! I am Sentinel, your AI pre-consultation concierge. What brings you in today?
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                Sentinel is typing<span>.</span><span>.</span><span>.</span>
            </div>
        </main>

        <footer class="input-area glass-panel">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Describe your symptoms..." autocomplete="off" required>
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
